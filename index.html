<!doctype html>
<html lang="zh-CN" suppressHydrationWarning>
  <head>
    <script defer src="https://umami.xc-lr.cn/script.js" data-website-id="2ef1e1b4-fad2-49c2-988a-07d174c7c642"></script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Starlr Forum — 运行在 Cloudflare 边缘的现代化中文社区" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <title>Starlr Forum</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 主题无闪烁初始化（与 next-themes storageKey/attribute/defaultTheme 一致）
      (function () {
        try {
          var t = localStorage.getItem('xc-theme');
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
